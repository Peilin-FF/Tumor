# Stage B v2 - the training fixes suggested by the failure analysis: SAM-Med2D encoder adapters
# trainable (encoder runs with gradients), 12 epochs, mask loss weighted up, IoU head trained.
# Initialise with --init-from <stage A adapter> as for stage B.
model:
  _base: configs/model/medplib_7b_2e.yaml
  loss: {ce: 1.0, bce: 2.0, dice: 2.0, iou: 1.0, focal: 0.0}
  trainable:
    new_modules: [mm_projector, text_hidden_fcs, visual_model.mask_decoder, deepspeed_moe.gate.wg, .Adapter.]
    frozen_always: [vision_tower, visual_model.prompt_encoder]
data: configs/dataset/brisc2025.yaml
stage: B
epochs: 12
seed: 42
lora: {r: 16, alpha: 32, dropout: 0.05}
optim:
  lr_lora: 2.0e-5
  lr_new: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  warmup_ratio: 0.03
  min_lr_ratio: 0.0
  grad_clip: 1.0
batch: {micro: 2, grad_accum: 4}
deepspeed: {zero_stage: 2}
workers: 4
log_every: 5
